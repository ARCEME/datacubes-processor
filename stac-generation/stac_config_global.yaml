collection_id: arceme-datacubes-global

collection_title: "ARCEME Data Cubes – DHP Global Sites"

collection_description: >
  Multi-sensor Earth observation data cubes for globally distributed extreme weather
  event sites from the DHP (Disaster Hazard Points) database, generated within the
  ARCEME project (Adaptation and Resilience to Climate Extremes and Multi-hazard Events).
  Each cube covers a 10 × 10 km area centred on the event location and integrates:
  Sentinel-2 L2A (13 bands + SCL, 10 m), Sentinel-1 RTC (VV + VH, 10 m),
  Copernicus DEM GLO-30 (10 m resampled), and ESA WorldCover 2020 (10 m).
  Two cube variants exist per event site — suffix "_d" (DHP-only) and "_dhp" (DHP+WOCAT).
  The temporal window spans ±12 months around the event date.
  Cloud masking is applied using SEnSeIv2/SegFormerB2.


locations_csv: /home/eouser/datacubes/data-cubes-arceme/data/ARCEME-DC-REPAIR.csv
skip_existing: true

spatial:
  edge_size: 10000
  units: m
  resolution: 10

temporal:
  increment_months: 12
  decrement_months: 12

sources:
  s2: cdse
  s1: planetary
  copdem: cdse
  esalc: planetary

collections:
  s2:
    - sentinel-2-l2a
  s1:
    - sentinel-1-rtc
  copdem:
    - cop-dem-glo-30-dged-cog
  esalc:
    - esa-worldcover

static_dates:
  copdem:
    start: "2010-01-01"
    end: "2024-12-31"
  esalc:
    start: "2019-01-01"
    end: "2020-12-31"

output_base_dir: /CUBE-STORAGE/ARCEME-DC-DHP-GLOBAL

s2_filter_contains_bbox: false

cloud_mask:
  enabled: true
  device: cpu
  stride: 512

merge:
  enabled: true
  chunk_time: 25
  chunk_x: 500
  chunk_y: 500
  prefer_latest_aux: true

  # Force re-merge for all locations regardless of whether a merged cube exists.
  # Group 1 (3): missing S2 optical bands + cloud_mask
  # Group 2 (5): missing ESA_LC (23586_d also missing S1)
  # Group 3 (24): missing S1 vv/vh — Planetary Computer had no data at time of original processing
  force_locations:
    - DC__41188_dhp
    - DC__41188_d
    - DC__60285_dhp
    - DC__62878_dhp
    - DC__59434_d
    - DC__23586_d
    - DC__21039_dhp
    - DC__17799_d
    - DC__16816_dhp
    - DC__45854_d
    - DC__60826_d
    - DC__61276_d
    - DC__81701_dhp
    - DC__81701_d
    - DC__81874_dhp
    - DC__81874_d
    - DC__81877_dhp
    - DC__81877_d
    - DC__82863_dhp
    - DC__82863_d
    - DC__82955_dhp
    - DC__82955_d
    - DC__83004_d
    - DC__92271_dhp
    - DC__93165_dhp
    - DC__93165_d
    - DC__93324_dhp
    - DC__93324_d
    - DC__96274_d
    - DC__99140_d
    - DC__99349_dhp
    - DC__99349_d

  vars_to_uint16:
    - B01
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B09
    - B11
    - B12
    - SCL
    - cloud_mask
    - ESA_LC

  attrs:
    project: "ARCEME - Adaptation and Resilience to Climate Extremes and Multi-hazard Events"
    contact: "mkluczek@cloudferro.com"
    run_name: "arceme_dc_repair"
    config_file: "src/processor/arceme_dc_repair_config.yaml"
    source_locations_csv: "/home/eouser/datacubes/data-cubes-arceme/data/ARCEME-DC-REPAIR.csv"
    location_source: "ARCEME-DC-DHP-GLOBAL"
    output_base_dir: "/CUBE-STORAGE/ARCEME-DC-DHP-GLOBAL"
    pixel_resolution_meters: "10"
    tile_edge_size_meters: "10000"
    tile_size_px: "1000x1000"
    resampling_method: "nearest neighbor"
    temporal_window: "event_date -12 months to +12 months"
    static_dates_copdem: "2010-01-01 to 2024-12-31"
    static_dates_esalc: "2019-01-01 to 2020-12-31"
    stac_endpoints: "CDSE: https://stac.dataspace.copernicus.eu/v1/ Planetary Computer: https://planetarycomputer.microsoft.com/api/stac/v1"
    collections: "CDSE: sentinel-2-l2a, cop-dem-glo-30-dged-cog; Planetary Computer: sentinel-1-rtc, esa-worldcover"
    time_axis: "time_sentinel_2_l2a, time_sentinel_1_rtc, time_cop_dem_glo_30_dged_cog, time_esa_worldcover"
    land_cover: "ESA World Cover 2020 map at 10 m resolution"
    land_cover_legend: "10 - Tree cover, 20 - Shrubland, 30 - Grassland, 40 - Cropland, 50 - Built-up, 60 - Bare / sparse vegetation, 70 - Snow and Ice, 80 - Permanent water bodies, 90 - Herbaceous wetland, 95 - Mangroves, 100 - Moss and lichen"
    land_cover_citation: "https://doi.org/10.5281/zenodo.5571936"
    Sentinel_2_SCL_description: "0: no_data, 1: saturated_or_defective, 2: dark_area_pixels, 3: cloud_shadows, 4: vegetation, 5: not_vegetated, 6: water, 7: unclassified, 8: cloud_medium_probability, 9: cloud_high_probability, 10: thin_cirrus, 11: snow"
    cloud_mask_description: "0: Unoccluded, 1: Thick cloud, 2: Thin cloud, 3: Shadow"
    cloud_mask_algorithm: "SEnSeIv2/SegFormerB2"
    cloud_mask_weights: "SEnSeIv2-SegFormerB2-alldata-ambiguous"
    cloud_mask_stride_size: "512"
    cloud_mask_citation: "https://www.doi.org/10.1109/TGRS.2024.3391625"
    merge_chunking: "time=25, x=500, y=500"
    dtype_conversion: "uint16 for S2 bands, SCL, cloud_mask, ESA_LC"
    fill_value_policy: "float=NaN, int=32767"
    data_cubes_producer: "CloudFerrro S.A."
